name: Pad Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pad-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branding:
    name: Pad branding and resource regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare configure-generated resource and run tests
        run: |
          # Root CMake copies this file to src during configure. This test-only
          # job does not configure Qt, so prepare the same generated resource.
          cp CHANGELOG.md src/CHANGELOG.md
          python3 -m unittest discover -s tests -p 'pad_branding_test.py' -v

  windows:
    name: Windows x64 / Qt5 / MSVC
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt5
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true
      - name: Install OpenSSL 1.1.1 (Qt 5.15 HTTPS runtime)
        run: |
          python -m pip install --quiet aqtinstall
          python -m aqt list-tool windows desktop tools_openssl_x64
          python -m aqt install-tool windows desktop tools_openssl_x64 qt.tools.openssl.win_x64 --outputdir "$env:RUNNER_TEMP/aqt-tools"
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL install failed' }
          Get-ChildItem "$env:RUNNER_TEMP/aqt-tools" -Recurse -Filter 'libssl*.dll' | ForEach-Object FullName
      - name: Test non-destructive profile association behavior
        run: |
          cmake -S packaging/windows/tests -B association-tests -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Association test configure failed' }
          cmake --build association-tests
          if ($LASTEXITCODE -ne 0) { throw 'Association test build failed' }
          ctest --test-dir association-tests --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Association test failed' }
      - name: Install SDL2
        run: ./packaging/windows/get-sdl2.ps1 -Destination "$env:RUNNER_TEMP/sdl2"
      - name: Configure Release portable build
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DUSE_QT6_BY_DEFAULT=OFF `
            -DPORTABLE_WIN=ON `
            -DCHECK_FOR_UPDATES=OFF `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DSDL2_PATH=$env:RUNNER_TEMP/sdl2" `
            "-DSDL2_INCLUDE_DIR=$env:RUNNER_TEMP/sdl2/include" `
            "-DSDL2_LIBRARY=$env:RUNNER_TEMP/sdl2/lib/x64/SDL2.lib" `
            "-DSDL2MAIN_LIBRARY=$env:RUNNER_TEMP/sdl2/lib/x64/SDL2main.lib" `
            "-DSDL2_DLL_LOCATION_DIR=$env:RUNNER_TEMP/sdl2/lib/x64"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
      - name: Compile Pad and translations
        run: |
          cmake --build build --target antimicrox updateqm --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'CMake build failed' }
      - name: Build native editor-model fixture
        run: |
          cmake -S packaging/windows/editor-tests -B editor-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DSDL2_PATH=$env:RUNNER_TEMP/sdl2" `
            "-DSDL2_INCLUDE_DIR=$env:RUNNER_TEMP/sdl2/include" `
            "-DSDL2_LIBRARY=$env:RUNNER_TEMP/sdl2/lib/x64/SDL2.lib" `
            "-DSDL2MAIN_LIBRARY=$env:RUNNER_TEMP/sdl2/lib/x64/SDL2main.lib" `
            "-DSDL2_DLL_LOCATION_DIR=$env:RUNNER_TEMP/sdl2/lib/x64"
          if ($LASTEXITCODE -ne 0) { throw 'Editor fixture configure failed' }
          cmake --build editor-build --target pad-editor-tests --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Editor fixture build failed' }
      - name: Test native editor models and capture real dialogs
        run: ./packaging/windows/editor-tests/run.ps1 -BuildDir editor-build -QtDir "$env:QT_ROOT_DIR" -SdlDir "$env:RUNNER_TEMP/sdl2"
      - name: Upload native editor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pad-Windows-editors-${{ github.sha }}
          path: editor-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Stage portable distribution
        run: ./packaging/windows/package.ps1 -BuildDir build -QtDir "$env:QT_ROOT_DIR" -SdlDir "$env:RUNNER_TEMP/sdl2" -OutputDir dist -Revision '${{ github.sha }}' -OpenSslDir "$env:RUNNER_TEMP/aqt-tools"
      - name: Test extracted zip without build dependencies in PATH
        run: ./packaging/windows/smoke-test.ps1 -Archive (Get-ChildItem dist/Pad-*-Windows-x64.zip | Select-Object -First 1).FullName -OutputDir smoke
      - name: Build installer (CI version 0.0.0)
        run: ./packaging/windows/make-installer.ps1 -StageDir (Get-ChildItem dist -Directory -Filter 'Pad-*-Windows-x64' | Select-Object -First 1).FullName -Version 0.0.0 -OutputDir dist
      - name: Test silent install, upgrade and uninstall
        run: ./packaging/windows/test-installer.ps1 -Installer (Resolve-Path 'dist/Pad-0.0.0-Windows-x64-Setup.exe').Path -Version 0.0.0
      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: Pad-Windows-x64-${{ github.sha }}
          path: |
            dist/Pad-*-Windows-x64.zip
            dist/Pad-*-Setup.exe
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pad-Windows-smoke-${{ github.sha }}
          path: smoke/
          if-no-files-found: warn
          retention-days: 14
