name: Release (draft)

# Tag vX.Y.Z builds Pad for Windows, runs the Windows gates and creates a DRAFT
# release with four assets. It never publishes: the owner reviews the draft and
# publishes it by hand.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency:
  group: pad-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 release build
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)$') { throw "Bad tag: $tag" }
          "PAD_VERSION=$($Matches[1])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt5
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true
      - name: Install OpenSSL 1.1.1 (Qt 5.15 HTTPS runtime)
        run: |
          $dir = 'C:\Program Files\OpenSSL-Win64'
          $log = @()
          choco install openssl --version=1.1.1.2100 -y --no-progress 2>&1 | Tee-Object -Variable chocoOut | Out-Null
          $log += ($chocoOut | Select-Object -Last 6) -join ' | '
          $found = Get-ChildItem 'C:\Program Files','C:\ProgramData\chocolatey\lib' -Recurse -Filter 'libssl-1_1-x64.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) {
            $log += 'choco gave no libssl; trying slproweb'
            $exe = "$env:RUNNER_TEMP/openssl-setup.exe"
            Invoke-WebRequest 'https://slproweb.com/download/Win64OpenSSL_Light-1_1_1w.exe' -OutFile $exe
            Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\OpenSSL111' -Wait
            $found = Get-ChildItem 'C:\OpenSSL111' -Recurse -Filter 'libssl-1_1-x64.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $found) { Write-Host "::error::OpenSSL 1.1.1 not found. $($log -join ' ;; ')"; exit 1 }
          "OPENSSL_DIR=$($found.DirectoryName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "OpenSSL at $($found.FullName)"
      - name: Download Interception (optional driver mode files)
        run: |
          $zip = "$env:RUNNER_TEMP/Interception.zip"
          Invoke-WebRequest 'https://github.com/oblitum/Interception/releases/download/v1.0.1/Interception.zip' -OutFile $zip
          "INTERCEPTION_ZIP=$zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Install SDL2
        run: ./packaging/windows/get-sdl2.ps1 -Destination "$env:RUNNER_TEMP/sdl2"
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DUSE_QT6_BY_DEFAULT=OFF `
            -DPORTABLE_WIN=ON `
            -DCHECK_FOR_UPDATES=OFF `
            "-DPAD_VERSION=$env:PAD_VERSION" `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DSDL2_PATH=$env:RUNNER_TEMP/sdl2" `
            "-DSDL2_INCLUDE_DIR=$env:RUNNER_TEMP/sdl2/include" `
            "-DSDL2_LIBRARY=$env:RUNNER_TEMP/sdl2/lib/x64/SDL2.lib" `
            "-DSDL2MAIN_LIBRARY=$env:RUNNER_TEMP/sdl2/lib/x64/SDL2main.lib" `
            "-DSDL2_DLL_LOCATION_DIR=$env:RUNNER_TEMP/sdl2/lib/x64"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
      - name: Build
        run: |
          cmake --build build --target antimicrox updateqm --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'CMake build failed' }
      - name: Stage portable distribution
        run: ./packaging/windows/package.ps1 -BuildDir build -QtDir "$env:QT_ROOT_DIR" -SdlDir "$env:RUNNER_TEMP/sdl2" -OutputDir dist -Revision '${{ github.sha }}' -Version $env:PAD_VERSION -OpenSslDir "$env:OPENSSL_DIR" -InterceptionZip "$env:INTERCEPTION_ZIP"
      - name: Smoke test extracted zip
        run: ./packaging/windows/smoke-test.ps1 -Archive "dist/Pad-$env:PAD_VERSION-Windows-x64.zip" -OutputDir smoke
      - name: Build installer
        run: ./packaging/windows/make-installer.ps1 -StageDir "dist/Pad-$env:PAD_VERSION-Windows-x64" -Version $env:PAD_VERSION -OutputDir dist
      - name: Test silent install, upgrade and uninstall
        run: ./packaging/windows/test-installer.ps1 -Installer (Resolve-Path "dist/Pad-$env:PAD_VERSION-Windows-x64-Setup.exe").Path -Version $env:PAD_VERSION
      - name: Verify checksums
        run: |
          Get-ChildItem dist -Filter *.sha256 | ForEach-Object {
            $line = (Get-Content $_.FullName -Raw).Trim()
            $expected, $file = $line -split '\s+', 2
            $actual = (Get-FileHash (Join-Path dist $file) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Checksum mismatch: $file" }
            Write-Host "OK $file $actual"
          }
          $n = @(Get-ChildItem dist -File | Where-Object { $_.Name -like 'Pad-*' }).Count
          if ($n -ne 4) { throw "Expected 4 release assets, found $n" }
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pad-release-${{ github.ref_name }}
          path: |
            dist/Pad-*.zip
            dist/Pad-*.exe
            dist/*.sha256
            smoke/
          retention-days: 30
      - name: Create DRAFT release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' --draft --verify-tag --title "Pad $env:PAD_VERSION" --notes "Pad $env:PAD_VERSION for Windows x64. Unsigned build: Windows SmartScreen may warn on first run." `
            "dist/Pad-$env:PAD_VERSION-Windows-x64-Setup.exe" "dist/Pad-$env:PAD_VERSION-Windows-x64-Setup.exe.sha256" `
            "dist/Pad-$env:PAD_VERSION-Windows-x64.zip" "dist/Pad-$env:PAD_VERSION-Windows-x64.zip.sha256"
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
