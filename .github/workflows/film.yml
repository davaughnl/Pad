name: Pad film capture

# Captures real frames of the real Pad widgets at high scale for the promo video.
on:
  push:
    branches: ['film/**']

jobs:
  capture:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt5
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true
      - name: Install SDL2
        run: ./packaging/windows/get-sdl2.ps1 -Destination "$env:RUNNER_TEMP/sdl2"
      - name: Build fixture
        run: |
          cmake -S packaging/windows/editor-tests -B editor-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DSDL2_PATH=$env:RUNNER_TEMP/sdl2" `
            "-DSDL2_INCLUDE_DIR=$env:RUNNER_TEMP/sdl2/include" `
            "-DSDL2_LIBRARY=$env:RUNNER_TEMP/sdl2/lib/x64/SDL2.lib" `
            "-DSDL2MAIN_LIBRARY=$env:RUNNER_TEMP/sdl2/lib/x64/SDL2main.lib" `
            "-DSDL2_DLL_LOCATION_DIR=$env:RUNNER_TEMP/sdl2/lib/x64"
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }
          cmake --build editor-build --target pad-editor-tests --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
      - name: Capture film frames
        env:
          PAD_FILM: '1'
        run: ./packaging/windows/editor-tests/run.ps1 -BuildDir editor-build -QtDir "$env:QT_ROOT_DIR" -SdlDir "$env:RUNNER_TEMP/sdl2" -OutputDir film-frames
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pad-film-frames
          path: film-frames/
